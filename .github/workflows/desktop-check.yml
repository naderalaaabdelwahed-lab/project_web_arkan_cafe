name: Desktop checks

on:
  push:
    branches: [offline-desktop, fix/desktop-deep-audit]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-check.yml"
  pull_request:
    branches: [offline-desktop]
    paths:
      - "desktop/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
        working-directory: desktop
      - name: Check JavaScript syntax
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check server/index.cjs
          node --check server/database.cjs
          node --check server/supabase.cjs
          node --check ui/renderer.js
          node --check ui/kitchen.js
          node --check test/server.test.cjs
        working-directory: desktop
      - name: Run POS API integration tests
        run: npm test
        working-directory: desktop
